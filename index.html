<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Red5 WHIP Adaptive Bitrate Controller</title>
    <script src="//webrtchacks.github.io/adapter/adapter-latest.js"></script>
    <script src="//cdn.jsdelivr.net/npm/red5pro-webrtc-sdk@15.4.0-alpha.1/red5pro-sdk.min.js"></script>
    <!-- <script src="//cdn.jsdelivr.net/npm/red5pro-webrtc-sdk@latest/red5pro-sdk.min.js"></script> -->
    <script src="script/StatsMonitor.js"></script>
    <script>
        ;(function () {
          console.log('------- USAGE --------')
          console.log('')
          console.log(
            'This page is designed to establish a Red5 Player using query params. You can provide query params in the URL in order to configure the player.'
          )
          console.log('The following query params are available:')
          console.log(
            '%c [host] ' +
              '%c       : hostname or IP. Default: `window.location.hostname`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [app] ' + '%c       : app context. Default: `live`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [stream_name] ' + '%c       : The name of the stream to pub/sub. Default: `mystream`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [api_version] ' + '%c       : The version of the Stream Manager 2.0 API. Default: `v1`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [node_group] ' + '%c       : The name of the node group to target if using Stream Manager 2.0. Default: `default`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [rta_user] ' + '%c       : Username for RoundTrip Authentication if using. Default: `undefined`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [rta_pass] ' + '%c       : Password for RoundTrip Authentication if using. Default: `undefined`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [rta_token] ' + '%c       : Token for RoundTrip Authentication if using. Default: `undefined`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [standalone] ' + '%c       : Flag to indicate that the streaming is requested on a standalone deployment - not Stream Manager 2.0. Default: `false`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [object_fit] ' + '%c       : Object fit style to assign to the video elements. https://developer.mozilla.org/en-US/docs/Web/CSS/object-fit',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
        })()
    </script>
    <style>
      :root {
        font-family: 'Courier New', Courier, monospace;
        line-height: 1.5;
        font-weight: 400;
        height: 100%;

        color: rgba(255, 255, 255, 0.87);

        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;

        --color-background: rgb(30, 39, 46);
        --color-panel: rgb(45, 55, 65);
        --color-cyan: rgb(0, 188, 212);
        --color-red: rgb(231, 76, 60);
        --color-text: rgb(200, 200, 200);
        --color-text-muted: rgb(140, 160, 170);
        --color-border: rgb(60, 75, 85);
        --color-light-gray: #637381;
      }

      body {
        margin: 0;
        font-weight: 400;
        font-size: 14px;
        background-color: var(--color-background);
        height: 100%;
      }

      .app {
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 40px;
        height: calc(100% - 80px);
        box-sizing: border-box;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 0 0 auto;
      }

      .right-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 400px;
      }

      .publisher-container {
        position: relative;
        background-color: rgb(10, 10, 10);
        border: 2px solid var(--color-border);
        border-radius: 4px;
        overflow: hidden;
      }

      video {
        display: block;
        width: 480px;
        height: 270px;
        object-fit: contain;
        background-color: rgb(10, 10, 10);
      }

      .button-container {
        display: flex;
        gap: 16px;
        justify-content: center;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-start {
        background-color: var(--color-light-gray);
        color: white;
      }

      .btn-stop {
        background-color: var(--color-red);
        color: white;
      }

      .event-log-container {
        background-color: var(--color-panel);
        border-radius: 4px;
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .event-log-header {
        font-size: 18px;
        font-weight: 600;
        color: var(--color-text);
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--color-border);
      }

      .event-log {
        flex: 1;
        overflow-y: auto;
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        line-height: 1.6;
      }

      .event-log-entry {
        color: var(--color-text-muted);
        margin-bottom: 4px;
      }

      .event-log-entry .timestamp {
        color: var(--color-text-muted);
      }

      .event-log-entry .message {
        color: var(--color-text);
      }

      .hidden {
        display: none;
      }

      .status-indicators {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 10;
        pointer-events: none;
      }

      .status-indicator {
        padding: 4px 12px;
        color: white;
        font-weight: bold;
        font-size: 12px;
        border-radius: 4px;
      }

      .status-indicator.live {
        background-color: var(--color-red);
      }

      .status-indicator.connecting {
        background-color: orange;
      }

      .status-indicator.lossy {
        background-color: var(--color-red);
      }

      .status-indicator.recovery {
        background-color: rgb(39, 174, 96);
      }

      .abr-container {
        display: flex;
        gap: 20px;
        color: var(--color-text);
        font-size: 13px;
      }

      .abr-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
      }

      .abr-control {
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid var(--color-border);
        background-color: var(--color-panel);
        color: var(--color-text);
        font-size: 13px;
      }

    </style>
    </head>
    <body>
        <div class="app">
            <div class="left-panel">
                <div class="publisher-container">
                    <div class="status-indicators">
                        <div id="connection-status-indicator" class="status-indicator connecting hidden">CONNECTING...</div>
                        <div id="live-status-indicator" class="status-indicator live hidden">LIVE</div>
                        <div id="lossy-status-indicator" class="status-indicator lossy hidden">LOSSY</div>
                        <div id="recovery-status-indicator" class="status-indicator recovery hidden">RECOVERY</div>
                    </div>
                    <video id="red5pro-publisher" class="red5pro-publisher" muted autoplay playsinline></video>
                </div>
                <div class="button-container">
                    <button id="start-btn" class="btn btn-start">Start Streaming</button>
                    <button id="stop-btn" class="btn btn-stop" disabled>Stop Streaming</button>
                </div>
                <div class="abr-container">
                    <p class="abr-field">
                        <label class="abr-label">Bandwidth (kbps):</label>
                        <select id="bandwidth-select" class="abr-control">
                            <option value="150">150</option>
                            <option value="300">300</option>
                            <option value="750">750</option>
                            <option value="1000">1000</option>
                            <option value="2500">2500</option>
                            <option value="unlimited" selected>Unlimited</option>
                        </select>
                    </p>
                    <p class="abr-field">
                        <label class="abr-label">Scale:</label>
                        <select id="scale-select" class="abr-control">
                            <option value="8">1/8</option>
                            <option value="4">1/4</option>
                            <option value="2">1/2</option>
                            <option value="1" selected>Original</option>
                        </select>
                    </p>
                </div>
            </div>
            <div class="right-panel stats-container">
              <div class="event-log-container">
                <div class="event-log-header">Stats</div>
                <div id="media-constraints-accepted-requested" class="media-constraints-accepted-requested">Media Constraints Accepted Requested: 0x0</div>
                <div id="media-constraints-accepted-accepted" class="media-constraints-accepted-accepted">Media Constraints Accepted Accepted: 0x0</div>
                <div id="media-constraints" class="media-constraints">Current Outgoing Video Frame: 0x0</div>
                <div id="estimated-bitrate" class="estimated-bitrate">Estimated Bitrate: 0</div>
                <div id="frames-encode-sent-ratio" class="frames-encode-sent-ratio">Frames Encode/Sent Ratio: 0</div>
                <div id="packet-loss-rate" class="packet-loss-rate">Packet Loss Rate: 0</div>
                <div id="rtt" class="rtt">RTT: 0</div>
                <div id="pli-fir-rate" class="pli-fir-rate">PLI/FIR Rate: 0</div>
              </div>
            </div>
        </div>
        <script>
            ;((window, red5, StatsMonitor) => {
              const { WHIPClient, setLogLevel } = red5
              setLogLevel(red5.LOG_LEVELS.DEBUG)

              const TARGET_BITRATE = 2500
              const LOSSY_BITRATE = 300
              const thresholds = {
                  PACKET_LOSS_HIGH: 5,
                  PACKET_LOSS_RECOVERY: 2,
                  RTT_HIGH: 0.3,
                  RTT_RECOVERY: 0.15,
                  PLI_FIR_RATE_HIGH: 3,
                  PLI_FIR_RATE_RECOVERY: 1,
                  CONSECUTIVE_SAMPLES_TO_TRIGGER: 3
              }

              const publisherContainer = document.querySelector('.publisher-container')
              const connectionIndicator = document.getElementById('connection-status-indicator')
              const liveIndicator = document.getElementById('live-status-indicator')
              const lossyIndicator = document.getElementById('lossy-status-indicator')
              const recoveryIndicator = document.getElementById('recovery-status-indicator')
              const estimatedBitrateElement = document.getElementById('estimated-bitrate')
              const framesEncodeSentRatioElement = document.getElementById('frames-encode-sent-ratio')
              const packetLossRateElement = document.getElementById('packet-loss-rate')
              const rttElement = document.getElementById('rtt')
              const pliFirRateElement = document.getElementById('pli-fir-rate')
              const mediaConstraintsElement = document.getElementById('media-constraints')
              const mediaConstraintsAcceptedRequestedElement = document.getElementById('media-constraints-accepted-requested')
              const mediaConstraintsAcceptedAcceptedElement = document.getElementById('media-constraints-accepted-accepted')
              const bandwidthSelect = document.getElementById('bandwidth-select')
              const scaleSelect = document.getElementById('scale-select')
              const startBtn = document.getElementById('start-btn')
              const stopBtn = document.getElementById('stop-btn')

              const searchParams = new URLSearchParams(window.location.search)
              const query = (param, defaultValue) => {
                return searchParams.has(param) ? searchParams.get(param) : defaultValue
              }

              const host = query('host', window.location.hostName)
              const app = query('app', 'live')
              const streamName = query('stream_name', 'mystream')
              const apiVersion = query('api_version', 'v1')
              const nodeGroup = query('node_group', 'default')
              const rtaUser = query('rta_user')
              const rtaPass = query('rta_pass')
              const rtaToken = query('rta_token')
              const objectFit = query('object_fit', 'contain')
              const standalone = query('standalone', 'false') === 'true'
      
              let publisher
              let shuttingDown = false
              let statsMonitor = new StatsMonitor({
                thresholds
              })

              const unwrapContraintsToString = constraints => {
                const { video: { width, height } } = constraints
                let w = width
                let h = height
                if (width.exact) {
                  w = width.exact
                } else if (width.min) {
                  w = width.min
                } else if (width.max) {
                  w = width.max
                }
                if (height.exact) {
                  h = height.exact
                } else if (height.min) {
                  h = height.min
                } else if (height.max) {
                  h = height.max
                }
                return `${w}x${h}`
              }
      
              const configureAuth = params => {
                if (rtaUser && rtaPass) {
                  params.user = rtaUser
                  params.password = rtaPass
                }
                if (rtaToken) {
                  params.token = rtaToken
                }
                return params
              }
      
              const getConfiguration = () => {
                if (standalone) {
                  return {
                    endpoint: `https://${host}/${app}/whip/endpoint/${streamName}`,
                    streamName,
                    connectionParams: configureAuth({})
                  }
                }
                // Else, Stream Manager 2.0 integration.
                return {
                  endpoint: `https://${host}/as/${apiVersion}/proxy/whip/${app}/${streamName}`,
                  streamName,
                  connectionParams: configureAuth({
                    nodeGroup
                  })
                }
              }

              const onPublisherEvent = event => {
                const { type } = event
                if (type === 'Publish.Available') {
                    connectionIndicator.classList.add('hidden')
                    liveIndicator.classList.remove('hidden')
                    startBtn.disabled = true
                    stopBtn.disabled = false
                } else if (type === 'Publisher.Connection.Closed') {
                    unpublish()
                } else if ( type === 'WebRTC.MediaConstraints.Accepted') {
                    const { requested, accepted } = event.data
                    mediaConstraintsElement.textContent = `Current Outgoing Video Frame: ${unwrapContraintsToString(requested)}`
                    mediaConstraintsAcceptedRequestedElement.textContent = `Media Constraints Accepted Requested: ${unwrapContraintsToString(requested)}`
                    mediaConstraintsAcceptedAcceptedElement.textContent = `Media Constraints Accepted Accepted: ${unwrapContraintsToString(accepted)}`
                } else if (type === 'WebRTC.Stats.Report') {
                    const { data } = event
                    const stats = statsMonitor.process(data)
                    if (stats) {
                        const { estimatedBitrate, frameWidth, frameHeight, framesEncoded, framesSent, packetLossRate, rtt, pliFirRate } = stats
                        estimatedBitrateElement.textContent = `Estimated Bitrate: ${estimatedBitrate}`
                        framesEncodeSentRatioElement.textContent = `Frames Encode/Sent Ratio: ${framesEncoded / framesSent}`
                        packetLossRateElement.textContent = `Packet Loss Rate: ${packetLossRate}`
                        rttElement.textContent = `RTT: ${rtt}`
                        pliFirRateElement.textContent = `PLI/FIR Rate: ${pliFirRate}`
                        mediaConstraintsElement.textContent = `Current Outgoing Video Frame: ${frameWidth}x${frameHeight}`
                    }
                    return
                }
                console.log('[Publisher]', type)
              }
      
              const publish = async () => {
                try {
                  startBtn.disabled = true
                  connectionIndicator.classList.remove('hidden')
                  const config = {
                    ...getConfiguration(),
                    mediaConstraints: {
                        audio: true,
                        video: {
                            width: {
                                exact: 1920
                            },
                            height: {
                                exact: 1080
                            },
                            frameRate: {
                                min: 30,
                                max: 60
                            }
                        }
                    },
                    bandwidth: {
                        audio: 128,
                        video: TARGET_BITRATE
                    },
                    clearMediaOnUnpublish: true,
                    stats: {
                        endpoint: red5.StatsEndpointType.EVENT_TRANSPORT,
                        interval: 1000
                    }
                  }
                  publisher = new WHIPClient()
                  publisher.on('*', onPublisherEvent)
                  await publisher.init(config)
                  await publisher.publish()
                } catch (e) {
                  connectionIndicator.classList.add('hidden')
                  startBtn.disabled = false
                  await unpublish()
                }
              }
      
              const unpublish = async () => {
                if (!publisher) {
                  return
                }
                try {
                  await publisher.unpublish()
                  publisher.off('*', onPublisherEvent)
                } catch (e) {
                  // noop.
                }
                publisher = undefined
                liveIndicator.classList.add('hidden')
                lossyIndicator.classList.add('hidden')
                recoveryIndicator.classList.add('hidden')
                connectionIndicator.classList.add('hidden')
                startBtn.disabled = false
                stopBtn.disabled = true
              }
      
              const start = () => {
                document.querySelectorAll('video').forEach(video => {
                  video.style.objectFit = objectFit
                })
                startBtn.addEventListener('click', async () => {
                  try {
                    await publish()
                  } catch (e) {
                    console.error(`Could not start publisher: ${e.message}`)
                  }
                })
                stopBtn.addEventListener('click', async () => {
                  await unpublish()
                })
              }

              const getVideoTrackSender = async (connection) => {
                const senders = await connection.getSenders()
                return senders.find(sender => sender.track.kind === 'video')
              }

              const onLossy = async ({ packetLossRate, rtt, pliFirRate }) => {
                const videoTrackSender = await getVideoTrackSender(publisher.getPeerConnection())
                if (videoTrackSender) {
                    const parameters = videoTrackSender.getParameters()
                    if (!parameters.encodings) {
                        parameters.encodings = [{}]
                    }
                    parameters.encodings[0].maxBitrate = LOSSY_BITRATE * 1000
                    parameters.encodings[0].scaleResolutionDownBy = 8
                    bandwidthSelect.value = `${LOSSY_BITRATE}`
                    scaleSelect.value = `${8}`
                    await videoTrackSender.setParameters(parameters)
                    lossyIndicator.classList.remove('hidden')
                    recoveryIndicator.classList.add('hidden')
                }
                console.log('[stat] Monitor: onLossy', packetLossRate, rtt, pliFirRate)
              }
              const onRecovery = async ({ packetLossRate, rtt, pliFirRate }) => {
                const videoTrackSender = await getVideoTrackSender(publisher.getPeerConnection())
                if (videoTrackSender) {
                    const parameters = videoTrackSender.getParameters()
                    if (!parameters.encodings) {
                        parameters.encodings = [{}]
                    }
                    parameters.encodings[0].maxBitrate = TARGET_BITRATE * 1000
                    parameters.encodings[0].scaleResolutionDownBy = 1
                    bandwidthSelect.value = `${TARGET_BITRATE}`
                    scaleSelect.value = `${1.0}`
                    await videoTrackSender.setParameters(parameters)
                    recoveryIndicator.classList.remove('hidden')
                    lossyIndicator.classList.add('hidden')
                }
                console.log('[stat] Monitor: onRecovery', packetLossRate, rtt, pliFirRate)
              }

              const onBandwidthChange = async () => {
                const value = bandwidthSelect.value
                const videoTrackSender = await getVideoTrackSender(publisher.getPeerConnection())
                if (videoTrackSender) {
                    const parameters = videoTrackSender.getParameters()
                    if (!parameters.encodings) {
                        parameters.encodings = [{}]
                    }
                    if (value === 'unlimited') {
                      delete parameters.encodings[0].maxBitrate
                    } else {
                      parameters.encodings[0].maxBitrate = parseInt(value, 10) * 1000
                    }
                    await videoTrackSender.setParameters(parameters)
                }
              }
              const onScaleChange = async () => {
                const value = scaleSelect.value
                const videoTrackSender = await getVideoTrackSender(publisher.getPeerConnection())
                if (videoTrackSender) {
                    const parameters = videoTrackSender.getParameters()
                    if (!parameters.encodings) {
                        parameters.encodings = [{}]
                    }
                    parameters.encodings[0].scaleResolutionDownBy = 1 / parseInt(value, 10)
                    await videoTrackSender.setParameters(parameters)
                }
              }
     
              bandwidthSelect.addEventListener('change', onBandwidthChange)
              scaleSelect.addEventListener('change', onScaleChange)

              // Clean up on leave of page.
              window.addEventListener('beforeunload', async () => {
                shuttingDown = true
                await unpublish()
              })
              window.addEventListener('pagehide', async () => {
                shuttingDown = true
                await unpublish()
              })
      
              statsMonitor.setOnLossy(onLossy)
              statsMonitor.setOnRecovery(onRecovery)
              start()
            })(window, window.red5prosdk, window.StatsMonitor)
          </script>
    </body>
</html>
