<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Red5 WHIP Adaptive Bitrate Controller</title>
    <script src="//webrtchacks.github.io/adapter/adapter-latest.js"></script>
    <!-- <script src="//cdn.jsdelivr.net/npm/red5pro-webrtc-sdk@latest/red5pro-sdk.min.js"></script> -->
    <script src="lib/red5pro/red5pro-sdk.min.js"></script>
    <script src="script/StatsMonitor.js"></script>
    <script>
        ;(function () {
          console.log('------- USAGE --------')
          console.log('')
          console.log(
            'This page is designed to establish a Red5 Player using query params. You can provide query params in the URL in order to configure the player.'
          )
          console.log('The following query params are available:')
          console.log(
            '%c [host] ' +
              '%c       : hostname or IP. Default: `window.location.hostname`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [app] ' + '%c       : app context. Default: `live`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [stream_name] ' + '%c       : The name of the stream to pub/sub. Default: `mystream`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [api_version] ' + '%c       : The version of the Stream Manager 2.0 API. Default: `v1`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [node_group] ' + '%c       : The name of the node group to target if using Stream Manager 2.0. Default: `default`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [rta_user] ' + '%c       : Username for RoundTrip Authentication if using. Default: `undefined`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [rta_pass] ' + '%c       : Password for RoundTrip Authentication if using. Default: `undefined`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [rta_token] ' + '%c       : Token for RoundTrip Authentication if using. Default: `undefined`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [standalone] ' + '%c       : Flag to indicate that the streaming is requested on a standalone deployment - not Stream Manager 2.0. Default: `false`',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
          console.log('')
          console.log(
            '%c [object_fit] ' + '%c       : Object fit style to assign to the video elements. https://developer.mozilla.org/en-US/docs/Web/CSS/object-fit',
            'background: #222; color: #ebefd0',
            'background: #fff; color: #222'
          )
        })()
    </script>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
        line-height: 1.5;
        font-weight: 400;
        height: 100%;

        color: rgba(255, 255, 255, 0.87);

        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;

        --color-black: rgb(12, 12, 12);
        --color-red5: rgb(208, 56, 50);
        --color-gray: rgb(136, 136, 136);
        --color-offwhite: rgb(245, 245, 245, 0.87);
      }

      body {
        margin: 0;
        font-weight: 300;
        font-size: 0.8rem;
        background-color: var(--color-black);
        height: 100%;
      }

      .app {
        display: flex;
        flex-direction: column;
        row-gap: 16px;
        width: 100%;
        height: 100%;
      }

      .app .video-container {
        flex: 1;
        flex-basis: 0;
      }

      .red5pro-subscriber {
        width: 100%;
        height: 100%;
      }

      video {
        object-fit: contain;
        aspect-ratio: 16 / 9;
        max-height: 360px;
      }

      .publisher-container {
        position: relative;
      }

      .stats-container {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        background-color: white;
        border-radius: 5px;
        color: black;
      }

      .live-status-indicator {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 4px 12px;
        background-color: red;
        color: white;
        font-weight: bold;
        font-size: 14px;
        border-radius: 5px;
        z-index: 10;
        pointer-events: none;
      }

      .hidden {
        display: none;
      }

      .connection-status-indicator {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 4px 12px;
        background-color: green;
        color: white;
        font-weight: bold;
        font-size: 14px;
        border-radius: 5px;
        z-index: 10;
        pointer-events: none;
      }

      .lossy-status-indicator {
        position: absolute;
        top: 40px;
        left: 10px;
        padding: 4px 12px;
        background-color: red;
        color: white;
        font-weight: bold;
        font-size: 14px;
        border-radius: 5px;
        z-index: 10;
        pointer-events: none;
      }

      .recovery-status-indicator {
        position: absolute;
        top: 40px;
        left: 10px;
        padding: 4px 12px;
        background-color: green;
        color: white;
        font-weight: bold;
        font-size: 14px;
        border-radius: 5px;
        z-index: 10;
        pointer-events: none;
      }
    </style>
    </head>
    <body>
        <div class="app">
            <div class="publisher-container">
                <div id="connection-status-indicator" class="connection-status-indicator hidden">CONNECTING...</div>
                <div id="live-status-indicator" class="live-status-indicator hidden">LIVE</div>
                <div id="lossy-status-indicator" class="lossy-status-indicator hidden">LOSSY</div>
                <div id="recovery-status-indicator" class="recovery-status-indicator hidden">RECOVERY</div>
                <video id="red5pro-publisher" class="red5pro-publisher" muted autoplay playsinline></video>
            </div>
            <div class="stats-container">
                <div id="estimated-bitrate" class="estimated-bitrate">Estimated Bitrate: 0</div>
                <div id="frames-encode-sent-ratio" class="frames-encode-sent-ratio">Frames Encode/Sent Ratio: 0</div>
                <div id="packet-loss-rate" class="packet-loss-rate">Packet Loss Rate: 0</div>
                <div id="rtt" class="rtt">RTT: 0</div>
                <div id="pli-fir-rate" class="pli-fir-rate">PLI/FIR Rate: 0</div>
            </div>
        </div>
        <script>
            ;((window, red5, StatsMonitor) => {
              const { WHIPClient, setLogLevel } = red5
              setLogLevel(red5.LOG_LEVELS.DEBUG)

              const thresholds = {
                  PACKET_LOSS_HIGH: 5,
                  PACKET_LOSS_RECOVERY: 2,
                  RTT_HIGH: 0.3,
                  RTT_RECOVERY: 0.15,
                  PLI_FIR_RATE_HIGH: 3,
                  PLI_FIR_RATE_RECOVERY: 1,
                  CONSECUTIVE_SAMPLES_TO_TRIGGER: 3
              }

              const publisherContainer = document.querySelector('.publisher-container')
              const connectionIndicator = document.getElementById('connection-status-indicator')
              const liveIndicator = document.getElementById('live-status-indicator')
              const lossyIndicator = document.getElementById('lossy-status-indicator')
              const recoveryIndicator = document.getElementById('recovery-status-indicator')
              const estimatedBitrateElement = document.getElementById('estimated-bitrate')
              const framesEncodeSentRatioElement = document.getElementById('frames-encode-sent-ratio')
              const packetLossRateElement = document.getElementById('packet-loss-rate')
              const rttElement = document.getElementById('rtt')
              const pliFirRateElement = document.getElementById('pli-fir-rate')
      
              const searchParams = new URLSearchParams(window.location.search)
              const query = (param, defaultValue) => {
                return searchParams.has(param) ? searchParams.get(param) : defaultValue
              }

              const host = query('host', window.location.hostName)
              const app = query('app', 'live')
              const streamName = query('stream_name', 'mystream')
              const apiVersion = query('api_version', 'v1')
              const nodeGroup = query('node_group', 'default')
              const rtaUser = query('rta_user')
              const rtaPass = query('rta_pass')
              const rtaToken = query('rta_token')
              const objectFit = query('object_fit', 'contain')
              const standalone = query('standalone', 'false') === 'true'
      
              let publisher
              let shuttingDown = false
              let statsMonitor = new StatsMonitor({
                thresholds
              })
      
              const configureAuth = params => {
                if (rtaUser && rtaPass) {
                  params.user = rtaUser
                  params.password = rtaPass
                }
                if (rtaToken) {
                  params.token = rtaToken
                }
                return params
              }
      
              const getConfiguration = () => {
                if (standalone) {
                  return {
                    endpoint: `https://${host}/${app}/whip/endpoint/${streamName}`,
                    streamName,
                    connectionParams: configureAuth({})
                  }
                }
                // Else, Stream Manager 2.0 integration.
                return {
                  endpoint: `https://${host}/as/${apiVersion}/proxy/whip/${app}/${streamName}`,
                  streamName,
                  connectionParams: configureAuth({
                    nodeGroup
                  })
                }
              }

              const onPublisherEvent = event => {
                const { type } = event
                if (type === 'Publish.Available') {
                    connectionIndicator.classList.add('hidden')
                    liveIndicator.classList.remove('hidden')
                } else if (type === 'WebRTC.Stats.Report') {
                    const { data } = event
                    const stats = statsMonitor.process(data)
                    if (stats) {
                        const { estimatedBitrate, framesEncoded, framesSent, packetLossRate, rtt, pliFirRate } = stats
                        // TODO: place the stats in the DOM.
                        estimatedBitrateElement.textContent = `Estimated Bitrate: ${estimatedBitrate}`
                        framesEncodeSentRatioElement.textContent = `Frames Encode/Sent Ratio: ${framesEncoded / framesSent}`
                        packetLossRateElement.textContent = `Packet Loss Rate: ${packetLossRate}`
                        rttElement.textContent = `RTT: ${rtt}`
                        pliFirRateElement.textContent = `PLI/FIR Rate: ${pliFirRate}`
                    }
                }
                console.log('[Publisher]', type)
              }
      
              const publish = async () => {
                try {
                  connectionIndicator.classList.remove('hidden')
                  const config = {
                    ...getConfiguration(),
                    mediaConstraints: {
                        audio: true,
                        video: {
                            width: {
                                exact: 1920
                            },
                            height: {
                                exact: 1080
                            },
                            frameRate: {
                                min: 30,
                                max: 60
                            }
                        }
                    },
                    clearMediaOnUnpublish: true,
                    stats: {
                        endpoint: red5.StatsEndpointType.EVENT_TRANSPORT,
                        interval: 1000
                    }
                  }
                  publisher = new WHIPClient()
                  publisher.on('*', onPublisherEvent)
                  await publisher.init(config)
                  await publisher.publish()
                  // TODO: Remove below. Just for testing.
                  publisherContainer.onclick = () => {
                    unpublish()
                  }
                } catch (e) {
                  connectionIndicator.classList.add('hidden')
                  await unpublish()
                }
              }
      
              const unpublish = async () => {
                if (!publisher) {
                  return
                }
                try {
                  await publisher.unpublish()
                  publisher.off('*', onPublisherEvent)
                } catch (e) {
                  // noop.
                }
                publisher = undefined
                liveIndicator.classList.add('hidden')
                lossyIndicator.classList.add('hidden')
                recoveryIndicator.classList.add('hidden')
                connectionIndicator.classList.add('hidden')
              }
      
              const start = async () => {
                document.querySelectorAll('video').forEach(video => {
                  video.style.objectFit = objectFit
                })
                try {
                  await publish()
                } catch (e) {
                  alert(`Could not start publisher: ${e.message}`)
                }
              }

              const getVideoTrackSender = async (connection) => {
                const senders = await connection.getSenders()
                return senders.find(sender => sender.track.kind === 'video')
              }

              const onLossy = async ({ packetLossRate, rtt }) => {
                const videoTrackSender = await getVideoTrackSender(publisher.getPeerConnection())
                if (videoTrackSender) {
                    const parameters = videoTrackSender.getParameters()
                    if (!parameters.encodings) {
                        parameters.encodings = [{}]
                    }
                    parameters.encodings[0].maxBitrate = 320 * 1000
                    parameters.encodings[0].scaleResolutionDownBy = 4
                    await videoTrackSender.setParameters(parameters)
                    console.log('[stat] Monitor: onLossy', parameters)
                    lossyIndicator.classList.remove('hidden')
                    recoveryIndicator.classList.add('hidden')
                }
                console.log('[stat] Monitor: onLossy', packetLossRate, rtt)
              }
              const onRecovery = async ({ packetLossRate, rtt }) => {
                const videoTrackSender = await getVideoTrackSender(publisher.getPeerConnection())
                if (videoTrackSender) {
                    const parameters = videoTrackSender.getParameters()
                    if (!parameters.encodings) {
                        parameters.encodings = [{}]
                    }
                    parameters.encodings[0].maxBitrate = 750 * 1000
                    parameters.encodings[0].scaleResolutionDownBy = 1
                    await videoTrackSender.setParameters(parameters)
                    console.log('[stat] Monitor: onRecovery', parameters)
                    recoveryIndicator.classList.remove('hidden')
                    lossyIndicator.classList.add('hidden')
                }
                console.log('[stat] Monitor: onRecovery', packetLossRate, rtt)
              }
      
              // Clean up on leave of page.
              window.addEventListener('beforeunload', async () => {
                shuttingDown = true
                await unpublish()
              })
              window.addEventListener('pagehide', async () => {
                shuttingDown = true
                await unpublish()
              })
      
              statsMonitor.setOnLossy(onLossy)
              statsMonitor.setOnRecovery(onRecovery)
              start()
            })(window, window.red5prosdk, window.StatsMonitor)
          </script>
    </body>
</html>
